name: cbsi-reforma

services:

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8085}:3000"
    environment:
      REGIME_URL: http://regime-regular:8080/api
      SIMPLES_URL: http://simples-nacional:8082/api
      DANFSE_URL: http://danfse:8080/api
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-120000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      - danfse
    restart: unless-stopped

  regime-regular:
    build:
      context: https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git#main
      dockerfile_inline: |
        FROM eclipse-temurin:25-jdk AS build
        WORKDIR /app
        COPY . .
        RUN ./mvnw --batch-mode --errors -q package -DskipTests \
          && mkdir -p calculadora/db \
          && ./mvnw --batch-mode --errors -q flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf
        FROM eclipse-temurin:25-jre
        WORKDIR /app
        COPY --from=build /app/target/api-regime-geral*.jar app.jar
        COPY --from=build /app/calculadora ./calculadora
        EXPOSE 8080
        ENTRYPOINT ["java", "-jar", "app.jar", "--spring.profiles.active=offline"]
    restart: unless-stopped

  simples-nacional:
    build:
      context: https://github.com/ReceitaFederal/calculadora-rtc-simples-nacional.git#main
      dockerfile_inline: |
        FROM eclipse-temurin:25-jdk AS build
        WORKDIR /app
        RUN apt-get update && apt-get install -y --no-install-recommends git \
          && rm -rf /var/lib/apt/lists/*
        COPY . .
        RUN git clone --depth 1 https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git /tmp/reg \
          && cp -r /tmp/reg/flyway ./flyway
        RUN ./mvnw --batch-mode --errors -q package -DskipTests \
          && mkdir -p calculadora/db \
          && ./mvnw --batch-mode --errors -q flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf
        FROM eclipse-temurin:25-jre
        WORKDIR /app
        COPY --from=build /app/target/api-simples-nacional*.jar app.jar
        COPY --from=build /app/calculadora ./calculadora
        EXPOSE 8082
        ENTRYPOINT ["java", "-jar", "app.jar", "--spring.profiles.active=offline"]
    restart: unless-stopped

  danfse:
    build:
      context: https://github.com/ReceitaFederal/calculadora-rtc-gerador-danfse.git#main
    environment:
      SERVER_PORT: 8080
    restart: unless-stopped
